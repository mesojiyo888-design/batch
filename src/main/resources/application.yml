server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ── DataSource (다중 DB) ─────────────────────────────────────────
# spring.datasource.* 는 사용하지 않음.
# MainDataSourceConfig / BizDataSourceConfig 가 app.datasource.* 를 직접 읽는다.
app:
  datasource:
    # [메인 DB] Spring Batch 메타(BATCH_*), SHEDLOCK, 스케줄/이력(BATCH_SCHEDULE, BATCH_RUN_HIST)
    main:
      driver-class-name: oracle.jdbc.OracleDriver
      url: jdbc:oracle:thin:@172.16.151.121:1521/ORCL
      username: c##user0001
      password: aD123456789
      hikari:
        pool-name: main-pool
        maximum-pool-size: 10
        minimum-idle: 3
        connection-test-query: SELECT 1 FROM DUAL
    # [업무 DB] 배치가 실제로 읽고 쓰는 업무 데이터
    biz:
      driver-class-name: oracle.jdbc.OracleDriver
      url: jdbc:oracle:thin:@172.16.151.121:1521/ORCL
      username: c##user0001
      password: aD123456789
      hikari:
        pool-name: biz-pool
        maximum-pool-size: 10
        minimum-idle: 3
        connection-test-query: SELECT 1 FROM DUAL

spring:
  # ── Spring Batch ───────────────────────────────────────────────
  batch:
    job:
      enabled: false                  # 시작 시 자동 실행 방지
    jdbc:
      isolation-level-for-create: READ_COMMITTED
      initialize-schema: never        # always: 자동생성, never: 생성안함, embedded: 내장DB만 자동생성

# ── MyBatis ──────────────────────────────────────────────────────
# 다중 DataSource 에서는 MyBatis 자동 구성이 꺼져서 mybatis.* 설정이 적용되지 않는다.
# camelCase 변환 / jdbcTypeForNull / 로그 설정은 MyBatisSupport.java 에서 코드로 지정한다.

# ── 배치 인스턴스 식별 ────────────────────────────────────────────
# Windows 는 HOSTNAME 환경변수가 없으므로 COMPUTERNAME 을 먼저 본다.
batch:
  instance-id: ${COMPUTERNAME:${HOSTNAME:batch-01}}

decorator:
  datasource:
    p6spy:
      enable-logging: true
